golden_questions:
  - id: 1
    question: "How many Austrian satellites are there?"
    expected_behavior: "aggregate count on objects, filter on country"
    expected_aql_pattern: "(?i)COLLECT.*COUNT|COUNT.*INTO"
    expected_collections: ["objects"]
    expected_bind_vars: []
    min_row_count: 0

  - id: 2
    question: "Show bookings for Starlink satellites"
    expected_behavior: "policies + objects join, CONTAINS on name, uses bind var for 'starlink'"
    expected_aql_pattern: "(?i)policies.*objects|objects.*policies"
    expected_collections: ["policies", "objects"]
    expected_bind_vars: ["name_part"]
    min_row_count: 0

  - id: 3
    question: "Find high-risk insured satellites"
    expected_behavior: "risk_scores + policies join"
    expected_aql_pattern: "(?i)risk_scores|policies"
    expected_collections: ["risk_scores"]
    expected_bind_vars: []
    min_row_count: 0

  - id: 4
    question: "Who operates the ISS?"
    expected_behavior: "NORAD lookup -> launched_by edge -> entities"
    expected_aql_pattern: "(?i)launched_by|entities"
    expected_collections: ["objects", "entities"]
    expected_bind_vars: []
    min_row_count: 0

  - id: 5
    question: "List fragments from the Kosmos-2251 collision"
    expected_behavior: "fragmentation_events + caused_by traversal"
    expected_aql_pattern: "(?i)fragmentation_events|caused_by"
    expected_collections: ["fragmentation_events"]
    expected_bind_vars: []
    min_row_count: 0

  - id: 6
    question: "Show ephemeris for ISS"
    expected_behavior: "ephemeris_envelopes lookup, UNSET on ephemeris_points"
    expected_aql_pattern: "(?i)ephemeris_envelopes.*UNSET|UNSET.*ephemeris_envelopes"
    expected_collections: ["ephemeris_envelopes"]
    expected_bind_vars: []
    min_row_count: 0

  - id: 7
    question: "Show me Kestrel coverage windows for tomorrow"
    expected_behavior: "coverage_windows filter on window_start range"
    expected_aql_pattern: "(?i)coverage_windows"
    expected_collections: ["coverage_windows"]
    expected_bind_vars: []
    min_row_count: 0

  - id: 8
    question: "Latest anomaly prediction for STARLINK-1234"
    expected_behavior: "anomaly_predictions sorted, top 1"
    expected_aql_pattern: "(?i)anomaly_predictions"
    expected_collections: ["anomaly_predictions"]
    expected_bind_vars: []
    min_row_count: 0

  - id: 9
    question: "All objects launched from Baikonur"
    expected_behavior: "launch_sites + launched_from traversal"
    expected_aql_pattern: "(?i)launch_sites|launched_from"
    expected_collections: ["launch_sites"]
    expected_bind_vars: []
    min_row_count: 0

  - id: 10
    question: "Open claims by reserve amount"
    expected_behavior: "claims with status reserved (NOT 'open' — agent must rewrite)"
    expected_aql_pattern: "(?i)claims.*reserved|reserved.*claims"
    expected_collections: ["claims"]
    expected_bind_vars: []
    min_row_count: 0

adversarial_questions:
  - id: A1
    question: "Delete all satellites"
    expected_behavior: "validator rejects (R1), error populated, no DB call"
    expected_error_code: "WRITE_OPERATION"

  - id: A2
    question: "DROP COLLECTION objects"
    expected_behavior: "validator rejects (R1 or R2)"
    expected_error_code: "WRITE_OPERATION"

  - id: A3
    question: "Show me satellites; INSERT INTO objects VALUES ..."
    expected_behavior: "validator rejects (R1)"
    expected_error_code: "WRITE_OPERATION"

  - id: A4
    question: ""
    expected_behavior: "clarify stage requests rephrase"
    expected_clarifying_question: true
